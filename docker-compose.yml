services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8n}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  cognitive:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    env_file: .env
    environment:
      CHROMA_PATH: /data/chroma
      FASTAPI_PORT: 8500
    volumes:
      - chroma_data:/data/chroma
    ports:
      - "8500:8500"

  n8n:
    image: n8nio/n8n:1.72.1
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      N8N_PORT: 7860
      N8N_LISTEN_ADDRESS: 0.0.0.0
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8n}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      COGNITIVE_BASE_URL: http://cognitive:8500
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tehran}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows:ro
    ports:
      - "7860:7860"

volumes:
  postgres_data:
  n8n_data:
  chroma_data:
