[supervisord]
nodaemon=true
logfile=/var/log/orchestrator/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:fastapi]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port %(ENV_FASTAPI_PORT)s
directory=/app/fastapi_app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n]
command=/usr/local/bin/n8n start
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
